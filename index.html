<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TikTok</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="logo">
        <span>Tik</span><span>Tok</span>
    </div>
    
    <div class="login-container">
        <h1>Log in to TikTok</h1>
        
        <div class="login-methods">
            <button class="login-btn phone-email" onclick="redirectToPhoneEmailLogin()" id="phoneEmailLogin">
                <i class="fas fa-mobile-alt"></i>
                Use phone or email
            </button>
            <button class="login-btn facebook">
                <i class="fab fa-facebook-f"></i>
                Continue with Facebook
            </button>
            <button class="login-btn google" onclick="redirectEmailLogin()">
                <i class="fab fa-google"></i>
                Continue with Google
            </button>
            <button class="login-btn twitter">
                <i class="fab fa-twitter"></i>
                Continue with Twitter
            </button>
        </div>
        
        <div class="divider">
            <span>OR</span>
        </div>
        
        <div class="footer">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
