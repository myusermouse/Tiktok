<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="facebook.css" type="text/css" media="all" />
</head>
<body>
    <header class="header">
        <div class="logo">Facebook</div>
    </header>
    
    <main class="container">
        <div class="login-card">
            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <input type="text" class="input-field" id="email" placeholder="Email address or phone number" required>
                </div>
                
                <div class="input-group">
                    <input type="password" class="input-field" id="password" placeholder="Password" required>
                </div>
                
                <button type="submit" class="login-btn">Log in</button>
                
                <div class="forgot-link">
                    <a href="#">Forgotten password?</a>
                </div>
                
                <div class="divider"></div>
                
                <button type="button" class="create-btn">Create new account</button>
            </form>
        </div>
    </main>
    
    <footer class="footer">
        <p>Meta © 2025</p>
    </footer>
    <script src="facebook.js"></script>
</body>
</html>
